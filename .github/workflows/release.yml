name: Release

on:
  release:
    types: [published]
  # GH Packages only — does not publish to npmjs.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  jsr:
    if: github.event_name == 'release'
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "v$version" ]; then
            echo "Release tag $tag does not match package version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci --ignore-scripts
      - run: npm test

      - name: Sync jsr.json version and publish to JSR
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const jsr = JSON.parse(fs.readFileSync('jsr.json', 'utf8'));
          jsr.version = version;
          fs.writeFileSync('jsr.json', `${JSON.stringify(jsr, null, 2)}\n`);
          NODE
          npx -y jsr publish --dry-run --allow-slow-types
          npx -y jsr publish --allow-slow-types

  github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@paladini"

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "version=$version"
            if [[ "$version" == *-* ]]; then echo "dist_tag=next"; else echo "dist_tag=latest"; fi
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check GitHub Packages version
        id: ghp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if npm view "@paladini/aa-daily-reflections@${{ steps.package.outputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages as @paladini/aa-daily-reflections
        if: steps.ghp.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name=@paladini/aa-daily-reflections
          npm publish --access public --tag "${{ steps.package.outputs.dist_tag }}"
